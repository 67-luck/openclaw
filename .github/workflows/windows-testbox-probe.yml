name: Windows V8 Synthetic Exception Control

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  synthetic:
    name: Windows Node 26.9 synthetic exception controls
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Setup Node.js
        run: |
          set -euo pipefail
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node "26.9.0"

      - name: Setup pnpm
        id: setup_pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          cache-mode: restore
          node-version: "26.9.0"

      - name: Bind source and native runtime
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ACTIVE_PNPM_VERSION: ${{ steps.setup_pnpm.outputs.pnpm-version }}
        run: |
          set -euo pipefail
          node_bin="$(cygpath -u "$(node -p 'require("node:path").dirname(process.execPath)')")"
          echo "NODE_BIN=$node_bin" >> "$GITHUB_ENV"
          node --input-type=module <<'BINDING'
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { createRequire } from "node:module";
          const hash = (file) => createHash("sha256").update(readFileSync(file)).digest("hex");
          const require = createRequire(import.meta.url);
          const sourceSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const nodeSha256 = hash(process.execPath);
          const packageManager = require("./package.json").packageManager;
          if (sourceSha !== process.env.GITHUB_SHA || sourceSha !== process.env.WORKFLOW_SHA) {
            throw new Error("Checkout, dispatch and workflow source differ");
          }
          if (process.platform !== "win32" || process.arch !== "x64" || process.versions.node !== "26.9.0" || nodeSha256 !== "8490398f5e0082772dfb0ae5a6ebdff98a97696a20cb9778b4f82eec79b6d0a1") {
            throw new Error("Native Node differs from the qualified Windows 26.9 binary");
          }
          if (packageManager.split("+")[0] !== `pnpm@${process.env.ACTIVE_PNPM_VERSION}`) {
            throw new Error("Active pnpm differs from the frozen repository pin");
          }
          const files = [
            ".github/workflows/windows-testbox-probe.yml",
            "src/daemon/schtasks.installed-exception-observer.test-support.ts",
            "src/daemon/schtasks.installed-exception-observer.test.ts",
            "src/daemon/schtasks.installed-command.test-support.ts",
            "src/daemon/schtasks.installed-command.test.ts",
            "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml",
          ];
          mkdirSync(".artifacts/windows-v8-synthetic", { recursive: true });
          writeFileSync(".artifacts/windows-v8-synthetic/binding.json", JSON.stringify({
            sourceSha, workflowSha: process.env.WORKFLOW_SHA,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            platform: process.platform, arch: process.arch, node: process.versions.node,
            nodeSha256, packageManager,
            sourceSha256: Object.fromEntries(files.map((file) => [file, hash(file)])),
            scope: "synthetic exception parser and command controls only",
          }, null, 2) + "\n");
          BINDING

      - name: Install frozen dependencies
        env:
          CI: true
        run: |
          set -euo pipefail
          export PATH="$NODE_BIN:$PATH"
          pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Run maintained synthetic controls
        env:
          CI: true
          OPENCLAW_VITEST_WORKER_CACHE: "1"
        run: |
          set -euo pipefail
          export PATH="$NODE_BIN:$PATH"
          node --input-type=module <<'VERIFY'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const binding = JSON.parse(readFileSync(".artifacts/windows-v8-synthetic/binding.json", "utf8"));
          const hash = (file) => createHash("sha256").update(readFileSync(file)).digest("hex");
          if (process.versions.node !== binding.node || hash(process.execPath) !== binding.nodeSha256) {
            throw new Error("Bound Node changed before the synthetic controls");
          }
          for (const [file, expected] of Object.entries(binding.sourceSha256)) {
            if (hash(file) !== expected) throw new Error(`Bound source changed: ${file}`);
          }
          VERIFY
          set +e
          node scripts/run-vitest.mjs src/daemon/schtasks.installed-exception-observer.test.ts src/daemon/schtasks.installed-command.test.ts 2>&1 | tee .artifacts/windows-v8-synthetic/test.log
          pipeline_codes=("${PIPESTATUS[@]}")
          set -e
          TEST_EXIT_CODE="${pipeline_codes[0]}" LOG_EXIT_CODE="${pipeline_codes[1]}" node --input-type=module <<'RESULT'
          import { writeFileSync } from "node:fs";
          writeFileSync(".artifacts/windows-v8-synthetic/result.json", JSON.stringify({
            testExitCode: Number(process.env.TEST_EXIT_CODE),
            logExitCode: Number(process.env.LOG_EXIT_CODE),
            qualification: "synthetic-only; no updater, package or Gateway execution",
          }, null, 2) + "\n");
          RESULT
          if [[ "${pipeline_codes[0]}" != 0 ]]; then exit "${pipeline_codes[0]}"; fi
          exit "${pipeline_codes[1]}"

      - name: Upload bounded synthetic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-v8-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/windows-v8-synthetic/binding.json
            .artifacts/windows-v8-synthetic/result.json
            .artifacts/windows-v8-synthetic/test.log
          if-no-files-found: warn
